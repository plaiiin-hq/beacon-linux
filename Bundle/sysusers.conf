# The account plaiiin Beacon runs as: no login, no home.
u beacon - "plaiiin Beacon" /var/lib/beacon /usr/sbin/nologin
# The account of its log reader (beacon-logwatch.service): no login, no home. The unit adds the group that may read the log.
u beacon-logs - "plaiiin Beacon log reader" - /usr/sbin/nologin
